[project]
name = "soc2-compliance-agents"
version = "0.1.0"
description = "Read-only AI agents that collect SOC 2 evidence, monitor control drift, check change compliance and prepare access reviews across GitHub, GitHub Actions and ServiceNow."
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk>=0.1.70,<0.2",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
soc2agents = "soc2agents.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
